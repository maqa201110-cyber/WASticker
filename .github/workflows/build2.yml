name: Build Sticker Atolyesi
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarini olustur
        run: |
          cat > settings.gradle.kts <<'WA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "WASticker"
          include(":app")
          WA_EOF
          cat > build.gradle.kts <<'WA_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          WA_EOF
          cat > gradle.properties <<'WA_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          WA_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'WA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.wasticker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stickeratolyesi.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          WA_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'WA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
              </queries>
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="Sticker Atölyesi"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name=".StickerContentProvider"
                      android:authorities="${applicationId}.stickercontentprovider"
                      android:enabled="true"
                      android:exported="true"
                      android:readPermission="com.whatsapp.sticker.READ" />
              </application>
          </manifest>
          WA_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'WA_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7C3AED" android:pathData="M30,12H78A18,18 0 0 1 96,30V78A18,18 0 0 1 78,96H30A18,18 0 0 1 12,78V30A18,18 0 0 1 30,12Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,30a24,24 0 1,0 0.01,0Z"/>
              <path android:fillColor="#7C3AED" android:pathData="M45,48a4,4 0 1,0 0.01,0Z"/>
              <path android:fillColor="#7C3AED" android:pathData="M63,48a4,4 0 1,0 0.01,0Z"/>
              <path android:strokeColor="#7C3AED" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M42,60Q54,73 66,60"/>
          </vector>
          WA_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'WA_EOF'
          <!doctype html>
          <html lang="tr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sticker Atölyesi</title>
          <style>
          :root{--bg:#f5f3fb;--fg:#1a1626;--cd:#fff;--mu:#6e6785;--ac:#7c3aed;--bd:#ddd8ec}
          @media(prefers-color-scheme:dark){:root{--bg:#120f1c;--fg:#ece8f7;--cd:#1c1829;--mu:#9d95b6;--ac:#9b6bff;--bd:#2f2943}}
          *{box-sizing:border-box}
          body{margin:0 auto;padding:14px;max-width:480px;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
          h1{font-size:22px;margin:6px 0 14px}
          section{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
          input,button,select{display:block;width:100%;margin-top:8px;padding:11px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px}
          button{background:var(--ac);color:#fff;border:0;font-weight:600}
          button:disabled{opacity:.4}
          .r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1 1 0;min-width:0}
          #tl button{flex:1 1 30%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);font-weight:500;padding:9px 4px;font-size:14px}
          #tl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
          #col{flex:0 0 56px;padding:2px;height:44px}
          input[type=range]{padding:0}
          label{display:block;margin-top:8px;font-size:14px;color:var(--mu)}
          #cv{width:100%;aspect-ratio:1;border-radius:10px;touch-action:none;background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0/20px 20px}
          #g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
          figure{margin:0;position:relative}
          figure img{width:100%;aspect-ratio:1;border-radius:8px;background:var(--bg)}
          figure b{position:absolute;top:-6px;right:-6px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#d93a35;color:#fff}
          .d{background:#d93a35}
          #t{position:fixed;left:14px;right:14px;bottom:18px;padding:12px;border-radius:10px;background:var(--fg);color:var(--bg);opacity:0;transition:opacity .2s;pointer-events:none}
          </style></head><body>
          <h1>Sticker atölyesi</h1>
          <section>
            <select id="ps" aria-label="Paket"></select>
            <input id="pn" placeholder="Paket adı"><input id="au" placeholder="Yapımcı adı">
            <div class="r"><button id="n1">+ Sabit paket</button><button id="n2">+ Video paketi</button></div>
          </section>
          <section>
            <canvas id="cv" width="512" height="512"></canvas>
            <div class="r" id="tl">
              <button data-t="mv" class="on">Kaydır</button><button data-t="lasso">Kırp</button><button data-t="er">Sil</button>
              <button data-t="rs">Geri getir</button><button data-t="dr">Çiz</button><button data-t="tx">Yazı</button>
            </div>
            <input id="f" type="file" accept="image/*,video/*">
            <label>Yakınlaştır<input id="z" type="range" min="30" max="300" value="100"></label>
            <label>Fırça / yazı boyu<input id="bs" type="range" min="4" max="80" value="20"></label>
            <div class="r"><input id="col" type="color" value="#ffffff" aria-label="Renk"><input id="tx" placeholder="Yazı: yazdıktan sonra tuvale dokun"></div>
            <input id="em" value="😀" aria-label="Emoji">
            <div class="r"><button id="rst">Sıfırla</button><button id="add">Pakete ekle</button></div>
          </section>
          <section>
            <b id="n"></b>
            <div id="g"></div>
            <button id="pub" disabled style="margin-top:14px">WhatsApp'a ekle</button>
            <button id="del" class="d">Paketi sil</button>
          </section>
          <div id="t"></div>
          <script>
          //MUX
          function b64b(u){const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
          function cat(ps){let n=0;for(const p of ps)n+=p.length;const o=new Uint8Array(n);let k=0;for(const p of ps){o.set(p,k);k+=p.length}return o}
          const T=s=>Uint8Array.from(s,c=>c.charCodeAt(0));
          const L=(n,b=4)=>Uint8Array.from({length:b},(_,i)=>(n>>>(8*i))&255);
          const ck=(t,d)=>cat([T(t),L(d.length),d,new Uint8Array(d.length&1)]);
          function frameChunks(b){const o=[];let p=12;
            while(p<b.length){const t=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]),n=(b[p+4]|b[p+5]<<8|b[p+6]<<16)>>>0,e=p+8+n+(n&1);
              if(t=='ALPH'||t=='VP8 '||t=='VP8L')o.push(b.slice(p,e));p=e}
            return cat(o)}
          function mux(urls,dur){
            const fr=urls.map(u=>ck('ANMF',cat([L(0,3),L(0,3),L(511,3),L(511,3),L(dur,3),Uint8Array.of(2),frameChunks(b64b(u))])));
            const body=cat([T('WEBP'),ck('VP8X',cat([Uint8Array.of(0x12,0,0,0),L(511,3),L(511,3)])),ck('ANIM',cat([L(0,4),L(0,2)])),...fr]);
            return cat([T('RIFF'),L(body.length),body])}
          function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
          ///MUX
          const $=i=>document.getElementById(i),A=window.Android,cv=$('cv'),cx=cv.getContext('2d');
          const mkc=()=>Object.assign(document.createElement('canvas'),{width:512,height:512});
          const mk=mkc(),ov=mkc(),mx=mk.getContext('2d'),ox=ov.getContext('2d');
          let src=null,vid=null,tool='mv',px=0,py=0,pts=[],last=null,PK=[],sel=null,dtap=0;
          try{sel=localStorage.sel}catch(e){}
          const cur=()=>PK.find(p=>p.id==sel)||PK[0];
          function toast(m){const t=$('t');t.textContent=m;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2600)}
          function reset(){mx.globalCompositeOperation='source-over';mx.clearRect(0,0,512,512);mx.fillStyle='#fff';mx.fillRect(0,0,512,512);ox.clearRect(0,0,512,512);px=py=0}
          function path(c,done){pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):(c.beginPath(),c.moveTo(p[0],p[1])));if(done)c.closePath()}
          function comp(c){
            c.clearRect(0,0,512,512);
            if(src){const w=src.videoWidth||src.width,h=src.videoHeight||src.height,s=Math.min(512/w,512/h)*$('z').value/100;
              c.drawImage(src,(512-w*s)/2+px,(512-h*s)/2+py,w*s,h*s)}
            c.globalCompositeOperation='destination-in';c.drawImage(mk,0,0);c.globalCompositeOperation='source-over';
            c.drawImage(ov,0,0)}
          function loop(){comp(cx);
            if(tool=='lasso'&&pts.length>1){cx.strokeStyle='#22c55e';cx.lineWidth=4;cx.setLineDash([10,8]);path(cx,false);cx.stroke();cx.setLineDash([])}
            requestAnimationFrame(loop)}
          function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*512/r.width,(e.clientY-r.top)*512/r.height]}
          function stroke(a,b){const c=tool=='dr'?ox:mx;
            c.lineCap=c.lineJoin='round';c.lineWidth=$('bs').value;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);
            c.globalCompositeOperation=tool=='er'?'destination-out':'source-over';
            c.strokeStyle=tool=='rs'?'#fff':tool=='er'?'#000':$('col').value;c.stroke();c.globalCompositeOperation='source-over'}
          cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);last=pos(e);
            if(tool=='lasso')pts=[last];
            else if(tool=='tx'){const t=$('tx').value;if(!t)return toast('Önce yazıyı yaz');
              ox.font='bold '+$('bs').value*3+'px sans-serif';ox.textAlign='center';ox.textBaseline='middle';
              ox.lineWidth=$('bs').value/2;ox.lineJoin='round';ox.strokeStyle='#000';ox.fillStyle=$('col').value;
              ox.strokeText(t,last[0],last[1],480);ox.fillText(t,last[0],last[1],480)}
            else if(tool!='mv')stroke(last,last)};
          cv.onpointermove=e=>{if(!last)return;const p=pos(e);
            if(tool=='mv'){px+=p[0]-last[0];py+=p[1]-last[1]}
            else if(tool=='lasso')pts.push(p);
            else if(tool!='tx')stroke(last,p);
            last=p};
          cv.onpointerup=cv.onpointercancel=()=>{
            if(tool=='lasso'&&pts.length>2){mx.globalCompositeOperation='destination-in';path(mx,true);mx.fillStyle='#fff';mx.fill();mx.globalCompositeOperation='source-over'}
            pts=[];last=null};
          document.querySelectorAll('#tl button').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('#tl button').forEach(x=>x.classList.toggle('on',x==b))});
          $('rst').onclick=reset;
          $('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);
            if(vid)vid.pause();vid=null;reset();
            if(f.type.startsWith('video')){const v=document.createElement('video');v.muted=v.loop=v.playsInline=true;
              v.onloadeddata=()=>{src=vid=v;v.play()};v.src=u}
            else{const i=new Image();i.onload=()=>{src=i};i.src=u}};
          function snap(){const c=mkc();comp(c.getContext('2d'));return c}
          function enc(c){let q=.9,u;do{u=c.toDataURL('image/webp',q);q-=.1}while(u.length*.75>95000&&q>.05);return u.split(',')[1]}
          function tray(c){const t=document.createElement('canvas');t.width=t.height=96;t.getContext('2d').drawImage(c,0,0,96,96);return t.toDataURL('image/png').split(',')[1]}
          async function anim(){
            const v=vid,n=Math.floor(Math.min(v.duration,3)*10);if(n<2)return null;
            v.pause();const fr=[];
            for(let i=0;i<n;i++){await new Promise(r=>{v.onseeked=r;v.currentTime=i/10+.01});fr.push(snap())}
            v.currentTime=.01;v.play();
            for(const st of [1,2,3])for(const q of [.6,.45,.3,.2]){
              const o=mux(fr.filter((_,i)=>i%st==0).map(c=>c.toDataURL('image/webp',q)),100*st);
              if(o.length<=490000)return o}
            return null}
          $('add').onclick=async()=>{
            const p=cur();if(!A)return toast('Sadece APK içinde çalışır');if(!p)return toast('Önce paket oluştur');
            if(!src)return toast('Önce görsel veya video seç');
            if(p.animated&&!vid)return toast('Video paketi için video seç');
            $('add').disabled=true;toast('Hazırlanıyor…');await new Promise(r=>setTimeout(r,60));
            try{
              const c=snap();let b;
              if(p.animated){const o=await anim();if(!o)return toast('Video 500 KB altına inmedi: daha kısa veya sade bir video dene');b=b64(o)}
              else b=enc(c);
              const t=tray(c),e=$('em').value;let id=p.id,r=A.addSticker(id,b,e,t);
              if(r=='full'){const base=p.name.replace(/ \d+$/,''),k=PK.filter(x=>x.name.startsWith(base)).length+1;
                id=A.newPack(base+' '+k,p.author,p.animated);sel=id;r=A.addSticker(id,b,e,t)}
              if(r!='ok')return toast(r);
              toast('Eklendi');load()
            }finally{$('add').disabled=false}};
          function load(){
            PK=JSON.parse(A.packs());if(!PK.find(p=>p.id==sel))sel=PK[0]&&PK[0].id;
            try{localStorage.sel=sel}catch(e){}
            $('ps').replaceChildren(...PK.map(p=>new Option((p.animated?'Video · ':'Sabit · ')+p.name+' ('+p.stickers.length+'/30)',p.id,false,p.id==sel)));
            show()}
          function show(){
            const p=cur(),g=$('g');g.replaceChildren();
            $('pub').disabled=!p||p.stickers.length<3;
            if(!p){$('n').textContent='Önce bir paket oluştur';return}
            $('pn').value=p.name;$('au').value=p.author;
            $('n').textContent=p.stickers.length+' / 30 · toplam '+PK.reduce((s,x)=>s+x.stickers.length,0)+' sticker';
            p.stickers.forEach((s,i)=>{const f=document.createElement('figure'),m=new Image(),x=document.createElement('b');
              m.src='/p/'+p.id+'/'+s.file;x.textContent='×';x.onclick=()=>{A.remove(p.id,i);load()};f.append(m,x);g.append(f)})}
          const mkp=a=>{if(!A)return toast('Sadece APK içinde çalışır');sel=A.newPack('Paketim '+(PK.length+1),$('au').value||'Ben',a);load()};
          $('n1').onclick=()=>mkp(false);$('n2').onclick=()=>mkp(true);
          $('ps').onchange=e=>{sel=e.target.value;try{localStorage.sel=sel}catch(x){}show()};
          $('pn').onchange=$('au').onchange=()=>{if(A&&cur()){A.edit(sel,$('pn').value,$('au').value);load()}};
          $('pub').onclick=()=>{const r=A.publish(sel);if(r!='ok')toast(r)};
          $('del').onclick=()=>{if(!cur())return;
            if(Date.now()-dtap>3000){dtap=Date.now();$('del').textContent='Emin misin? Tekrar bas';setTimeout(()=>$('del').textContent='Paketi sil',3000);return}
            A.deletePack(sel);dtap=0;$('del').textContent='Paketi sil';load()};
          reset();loop();if(A)load();
          </script></body></html>
          WA_EOF
          mkdir -p app/src/main/java/com/example/wasticker
          cat > app/src/main/java/com/example/wasticker/MainActivity.kt <<'WA_EOF'
          package com.example.wasticker

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import android.webkit.*
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.addJavascriptInterface(Bridge(), "Android")
                  // Sayfa ve sticker dosyaları sanal bir adresten sunulur: https://app.local/...
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                          val path = r.url.path ?: return null
                          return try {
                              when {
                                  path.startsWith("/p/") -> Store.safe(this@MainActivity, path.removePrefix("/p/"))?.let {
                                      WebResourceResponse(if (it.name.endsWith(".png")) "image/png" else "image/webp", null, it.inputStream())
                                  }
                                  path == "/index.html" -> WebResourceResponse("text/html", "utf-8", assets.open("index.html"))
                                  else -> null
                              }
                          } catch (e: Exception) { null }
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          startActivityForResult(
                              Intent(Intent.ACTION_GET_CONTENT).setType("*/*")
                                  .putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                                  .addCategory(Intent.CATEGORY_OPENABLE), 1
                          )
                          return true
                      }
                  }
                  web.loadUrl("https://app.local/index.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(r: Int, c: Int, d: Intent?) {
                  if (r == 1) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d))
                      fileCb = null
                  }
                  val err = d?.getStringExtra("validation_error")
                  if (r == 2 && err != null) Toast.makeText(this, err, Toast.LENGTH_LONG).show()
              }

              private fun d(id: String) = Store.dir(this, id)

              private fun mut(id: String, f: (JSONObject) -> String): String {
                  val a = Store.load(this)
                  val p = Store.find(a, id) ?: return "Paket bulunamadı"
                  val r = f(p)
                  if (r == "ok") { Store.touch(p); Store.save(this, a) }
                  return r
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun packs(): String = Store.load(this@MainActivity).toString()

                  @JavascriptInterface
                  fun newPack(name: String, author: String, animated: Boolean): String {
                      val a = Store.load(this@MainActivity)
                      val id = "p" + System.currentTimeMillis()
                      a.put(JSONObject().put("id", id).put("name", name.trim().ifEmpty { "Paketim" }.take(100))
                          .put("author", author.trim().ifEmpty { "Ben" }.take(100)).put("animated", animated)
                          .put("version", "1").put("stickers", JSONArray()))
                      Store.save(this@MainActivity, a)
                      return id
                  }

                  @JavascriptInterface
                  fun edit(id: String, name: String, author: String): String = mut(id) {
                      it.put("name", name.trim().ifEmpty { "Paketim" }.take(100))
                      it.put("author", author.trim().ifEmpty { "Ben" }.take(100))
                      "ok"
                  }

                  @JavascriptInterface
                  fun deletePack(id: String) {
                      val a = Store.load(this@MainActivity)
                      for (i in 0 until a.length()) if (a.getJSONObject(i).getString("id") == id) { a.remove(i); break }
                      Store.save(this@MainActivity, a)
                      d(id).deleteRecursively()
                  }

                  @JavascriptInterface
                  fun addSticker(id: String, b64: String, emoji: String, tray: String): String = mut(id) { p ->
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      val st = p.getJSONArray("stickers")
                      if (st.length() >= 30) return@mut "full"
                      if (bytes.size > (if (p.getBoolean("animated")) 500_000 else 100_000)) return@mut "Dosya çok büyük"
                      val name = "s${System.currentTimeMillis()}.webp"
                      File(d(id), name).writeBytes(bytes)
                      val t = File(d(id), "tray.png")
                      if (tray.isNotEmpty() && !t.exists()) t.writeBytes(Base64.decode(tray, Base64.DEFAULT))
                      st.put(JSONObject().put("file", name).put("emoji", emoji.trim().ifEmpty { "😀" }))
                      "ok"
                  }

                  @JavascriptInterface
                  fun remove(id: String, i: Int) {
                      mut(id) { p ->
                          val st = p.getJSONArray("stickers")
                          File(d(id), st.getJSONObject(i).getString("file")).delete()
                          st.remove(i)
                          if (st.length() == 0) File(d(id), "tray.png").delete()
                          "ok"
                      }
                  }

                  @JavascriptInterface
                  fun publish(id: String): String {
                      val p = Store.find(Store.load(this@MainActivity), id) ?: return "Paket bulunamadı"
                      if (p.getJSONArray("stickers").length() < 3) return "En az 3 sticker gerekli."
                      val name = p.getString("name")
                      runOnUiThread {
                          try {
                              startActivityForResult(
                                  Intent("com.whatsapp.intent.action.ENABLE_STICKER_PACK")
                                      .putExtra("sticker_pack_id", id)
                                      .putExtra("sticker_pack_authority", Store.authority(this@MainActivity))
                                      .putExtra("sticker_pack_name", name), 2
                              )
                          } catch (e: ActivityNotFoundException) {
                              Toast.makeText(this@MainActivity, "WhatsApp bulunamadı.", Toast.LENGTH_LONG).show()
                          }
                      }
                      return "ok"
                  }
              }
          }
