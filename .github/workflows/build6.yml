name: Build Sticker Atolyesi v6
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarini olustur
        run: |
          cat > settings.gradle.kts <<'WA_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "WASticker"
          include(":app")
          WA_EOF
          cat > build.gradle.kts <<'WA_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          WA_EOF
          cat > gradle.properties <<'WA_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          WA_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'WA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.wasticker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stickeratolyesi.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          WA_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'WA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
              </queries>
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="Sticker Atölyesi"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/octet-stream" />
                          <data android:mimeType="application/zip" />
                          <data android:mimeType="application/x-zip-compressed" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:host="*" />
                          <data android:mimeType="*/*" />
                          <data android:pathPattern=".*\\.wastickers" />
                          <data android:pathPattern=".*\\..*\\.wastickers" />
                          <data android:pathPattern=".*\\..*\\..*\\.wastickers" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name=".StickerContentProvider"
                      android:authorities="${applicationId}.stickercontentprovider"
                      android:enabled="true"
                      android:exported="true"
                      android:readPermission="com.whatsapp.sticker.READ" />
              </application>
          </manifest>
          WA_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'WA_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7C3AED" android:pathData="M30,12H78A18,18 0 0 1 96,30V78A18,18 0 0 1 78,96H30A18,18 0 0 1 12,78V30A18,18 0 0 1 30,12Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,30a24,24 0 1,0 0.01,0Z"/>
              <path android:fillColor="#7C3AED" android:pathData="M45,48a4,4 0 1,0 0.01,0Z"/>
              <path android:fillColor="#7C3AED" android:pathData="M63,48a4,4 0 1,0 0.01,0Z"/>
              <path android:strokeColor="#7C3AED" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M42,60Q54,73 66,60"/>
          </vector>
          WA_EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'WA_EOF'
          <!doctype html>
          <html lang="tr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Sticker Atölyesi</title>
          <style>
          :root{--tl:#118c7e;--dk:#0b6b60;--ac:#25d366;--bg:#ece5df;--mu:#7fb0a9;--bd:#cdd9d6}
          *{box-sizing:border-box}
          body{margin:0 auto;max-width:520px;min-height:100vh;background:var(--bg);color:#1c2b29;font:16px/1.4 system-ui,sans-serif;padding-bottom:96px}
          [hidden]{display:none!important}
          .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--tl);color:#fff}
          .bar h1{flex:1;margin:0;font-size:22px;line-height:1.2}
          .bar small{display:block;font-size:16px;font-weight:400;opacity:.8}
          input,button{display:block;width:100%;margin-top:8px;padding:11px;font:inherit;color:inherit;background:#fff;border:1px solid var(--bd);border-radius:10px}
          button{background:var(--ac);color:#fff;border:0;font-weight:700}
          button:disabled{opacity:.4}
          .bar button{width:auto;margin:0;padding:2px 8px;background:none;font-size:26px;line-height:1}
          .g{background:#e3ebe9;color:#1c2b29}.d{background:#d93a35}
          .r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1 1 0;min-width:0}
          .pc{display:flex;gap:16px;align-items:center;background:#fff;padding:14px 18px;border-bottom:1px solid #ddd}
          .pc b{display:block;color:var(--dk);font-size:20px}.pc small{color:var(--mu);font-size:17px}
          .th{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#dfe8e6;flex:none}
          .mu{padding:24px;color:#6a7e7b}
          .fab{position:fixed;right:14px;bottom:18px;width:auto;margin:0;padding:16px 22px;border-radius:32px;background:var(--ac);letter-spacing:.08em;box-shadow:0 4px 12px #0005;z-index:6}
          .fab.off{opacity:.45}
          #g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
          .sl{position:relative;aspect-ratio:1;border:3px dashed #4aa296;border-radius:28px;display:flex;align-items:center;justify-content:center;overflow:hidden}
          .sl.tr{grid-column:1/-1;width:44%;justify-self:center}.sl.tr span{font-size:12px;white-space:nowrap}
          .sl span{white-space:nowrap;position:absolute;top:10px;left:10px;z-index:1;background:var(--dk);color:#fff;border-radius:8px;padding:3px 9px;font-size:14px;font-weight:700}
          .sl i{font:normal 44px/1 sans-serif;color:var(--dk)}
          .sl img{width:100%;height:100%;object-fit:contain}
          .sl u{position:absolute;right:8px;bottom:8px;width:26px;height:26px;line-height:26px;text-align:center;text-decoration:none;border-radius:50%;background:#d93a35;color:#fff}
          .ed{padding:12px}.card{background:#fff;border-radius:14px;padding:12px}
          #cv{width:100%;aspect-ratio:1;border-radius:10px;touch-action:none;background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0/20px 20px}
          #tl button{flex:1 1 30%;background:#fff;color:#1c2b29;border:1px solid var(--bd);font-weight:500;padding:9px 4px;font-size:14px}
          #tl button.on{background:var(--tl);color:#fff;border-color:var(--tl)}
          #col{flex:0 0 56px;padding:2px;height:44px}
          input[type=range]{padding:0}
          label{display:block;margin-top:8px;font-size:14px;color:#6a7e7b}
          .ck input{display:inline;width:auto;margin:0 8px 0 0}
          #dg,#tp{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:20px;background:#0007}
          #dg .box,#tp .box{width:100%;max-width:400px;background:#fff;border-radius:14px;padding:16px}
          #t{position:fixed;left:14px;right:14px;bottom:18px;z-index:20;padding:12px;border-radius:10px;background:#1c2b29;color:#fff;opacity:0;transition:opacity .2s;pointer-events:none}
          </style></head><body>
          <div id="s1">
            <div class="bar"><h1>STICKER ATÖLYESİ</h1><button id="imp" style="font-size:14px;border:1px solid #fff9;border-radius:8px;padding:8px 10px">İÇE AKTAR</button></div>
            <div id="pl"></div><p class="mu" id="e0" hidden>Henüz paket yok. Aşağıdan yeni bir paket oluştur.</p>
            <button class="fab" id="nf">+ YENİ PAKET OLUŞTUR</button>
          </div>
          <div id="s2" hidden>
            <div class="bar"><button onclick="history.back()">←</button><h1><span id="pt"></span><small id="pa"></small></h1><button id="mn">⋮</button></div>
            <div id="g"></div>
            <button class="fab" id="wa">WHATSAPP'A EKLE</button>
          </div>
          <div id="s3" hidden>
            <div class="bar"><button onclick="history.back()">←</button><h1>Sticker oluştur</h1></div>
            <div class="ed"><div class="card">
              <canvas id="cv" width="512" height="512"></canvas>
              <div class="r" id="tl">
                <button data-t="mv" class="on">Kaydır</button><button data-t="lasso">Kırp</button><button data-t="er">Sil</button>
                <button data-t="rs">Geri getir</button><button data-t="dr">Çiz</button><button data-t="tx">Yazı</button>
              </div>
              <input id="f" type="file" accept="image/*,video/*">
              <label>Yakınlaştır<input id="z" type="range" min="30" max="300" value="100"></label>
              <label>Fırça / yazı boyu<input id="bs" type="range" min="4" max="80" value="20"></label>
              <div class="r"><input id="col" type="color" value="#ffffff" aria-label="Renk"><input id="tx" placeholder="Yazı: yazdıktan sonra tuvale dokun"></div>
              <div id="opt"><input id="em" value="😀" aria-label="Emoji"></div>
              <div class="r"><button id="rst" class="g">Sıfırla</button><button id="add">Pakete ekle</button></div>
            </div></div>
          </div>
          <div id="dg" hidden><div class="box"><b id="dgt"></b>
            <input id="dn" placeholder="Paket adı" maxlength="60"><input id="da" placeholder="Yapımcı adı" maxlength="60">
            <div class="r"><button id="dx" class="g">İptal</button><button id="dok">Kaydet</button></div>
            <button id="dexp" class="g" hidden>Dışa aktar (yedekle)</button><button id="ddel" class="d" hidden>Paketi sil</button></div></div>
          <div id="tp" hidden><div class="box"><b>Paket türü seç</b><button id="t1">Sticker</button><button id="t2">Animasyonlu sticker</button><button id="tx0" class="g">İptal</button></div></div>
          <div id="t"></div>
          <script>

          //MUX
          function b64b(u){const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
          function cat(ps){let n=0;for(const p of ps)n+=p.length;const o=new Uint8Array(n);let k=0;for(const p of ps){o.set(p,k);k+=p.length}return o}
          const T=s=>Uint8Array.from(s,c=>c.charCodeAt(0));
          const L=(n,b=4)=>Uint8Array.from({length:b},(_,i)=>(n>>>(8*i))&255);
          const ck=(t,d)=>cat([T(t),L(d.length),d,new Uint8Array(d.length&1)]);
          function frameChunks(b){const o=[];let p=12;
            while(p<b.length){const t=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]),n=(b[p+4]|b[p+5]<<8|b[p+6]<<16)>>>0,e=p+8+n+(n&1);
              if(t=='ALPH'||t=='VP8 '||t=='VP8L')o.push(b.slice(p,e));p=e}
            return cat(o)}
          function mux(urls,dur){
            const fr=urls.map(u=>ck('ANMF',cat([L(0,3),L(0,3),L(511,3),L(511,3),L(dur,3),Uint8Array.of(2),frameChunks(b64b(u))])));
            const body=cat([T('WEBP'),ck('VP8X',cat([Uint8Array.of(0x12,0,0,0),L(511,3),L(511,3)])),ck('ANIM',cat([L(0,4),L(0,2)])),...fr]);
            return cat([T('RIFF'),L(body.length),body])}
          function b64(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
          ///MUX
          const $=i=>document.getElementById(i),A=window.Android,cv=$('cv'),cx=cv.getContext('2d');
          const mkc=()=>Object.assign(document.createElement('canvas'),{width:512,height:512});
          const mk=mkc(),ov=mkc(),mx=mk.getContext('2d'),ox=ov.getContext('2d');
          let src=null,vid=null,tool='mv',px=0,py=0,pts=[],last=null,PK=[],sel=null,dtap=0;
          try{sel=localStorage.sel}catch(e){}
          const cur=()=>PK.find(p=>p.id==sel)||PK[0];
          function toast(m){const t=$('t');t.textContent=m;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2600)}
          function reset(){mx.globalCompositeOperation='source-over';mx.clearRect(0,0,512,512);mx.fillStyle='#fff';mx.fillRect(0,0,512,512);ox.clearRect(0,0,512,512);px=py=0}
          function path(c,done){pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):(c.beginPath(),c.moveTo(p[0],p[1])));if(done)c.closePath()}
          function comp(c){
            c.clearRect(0,0,512,512);
            if(src){const w=src.videoWidth||src.width,h=src.videoHeight||src.height,s=Math.min(512/w,512/h)*$('z').value/100;
              c.drawImage(src,(512-w*s)/2+px,(512-h*s)/2+py,w*s,h*s)}
            c.globalCompositeOperation='destination-in';c.drawImage(mk,0,0);c.globalCompositeOperation='source-over';
            c.drawImage(ov,0,0)}
          function loop(){comp(cx);
            if(tool=='lasso'&&pts.length>1){cx.strokeStyle='#22c55e';cx.lineWidth=4;cx.setLineDash([10,8]);path(cx,false);cx.stroke();cx.setLineDash([])}
            requestAnimationFrame(loop)}
          function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*512/r.width,(e.clientY-r.top)*512/r.height]}
          function stroke(a,b){const c=tool=='dr'?ox:mx;
            c.lineCap=c.lineJoin='round';c.lineWidth=$('bs').value;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);
            c.globalCompositeOperation=tool=='er'?'destination-out':'source-over';
            c.strokeStyle=tool=='rs'?'#fff':tool=='er'?'#000':$('col').value;c.stroke();c.globalCompositeOperation='source-over'}
          cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);last=pos(e);
            if(tool=='lasso')pts=[last];
            else if(tool=='tx'){const t=$('tx').value;if(!t)return toast('Önce yazıyı yaz');
              ox.font='bold '+$('bs').value*3+'px sans-serif';ox.textAlign='center';ox.textBaseline='middle';
              ox.lineWidth=$('bs').value/2;ox.lineJoin='round';ox.strokeStyle='#000';ox.fillStyle=$('col').value;
              ox.strokeText(t,last[0],last[1],480);ox.fillText(t,last[0],last[1],480)}
            else if(tool!='mv')stroke(last,last)};
          cv.onpointermove=e=>{if(!last)return;const p=pos(e);
            if(tool=='mv'){px+=p[0]-last[0];py+=p[1]-last[1]}
            else if(tool=='lasso')pts.push(p);
            else if(tool!='tx')stroke(last,p);
            last=p};
          cv.onpointerup=cv.onpointercancel=()=>{
            if(tool=='lasso'&&pts.length>2){mx.globalCompositeOperation='destination-in';path(mx,true);mx.fillStyle='#fff';mx.fill();mx.globalCompositeOperation='source-over'}
            pts=[];last=null};
          document.querySelectorAll('#tl button').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('#tl button').forEach(x=>x.classList.toggle('on',x==b))});
          $('rst').onclick=reset;
          $('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);
            if(vid)vid.pause();vid=null;reset();
            if(f.type.startsWith('video')){const v=document.createElement('video');v.muted=v.loop=v.playsInline=true;
              v.onloadeddata=()=>{src=vid=v;v.play()};v.src=u}
            else{const i=new Image();i.onload=()=>{src=i};i.src=u}};
          function snap(){const c=mkc();comp(c.getContext('2d'));return c}
          function enc(c){let q=.9,u;do{u=c.toDataURL('image/webp',q);q-=.1}while(u.length*.75>95000&&q>.05);return u.split(',')[1]}
          function tray(c){const t=document.createElement('canvas');t.width=t.height=96;t.getContext('2d').drawImage(c,0,0,96,96);return t.toDataURL('image/png').split(',')[1]}
          async function anim(){
            const v=vid,n=Math.floor(Math.min(v.duration,3)*10);if(n<2)return null;
            v.pause();const fr=[];
            for(let i=0;i<n;i++){await new Promise(r=>{v.onseeked=r;v.currentTime=i/10+.01});fr.push(snap())}
            v.currentTime=.01;v.play();
            for(const st of [1,2,3])for(const q of [.6,.45,.3,.2]){
              const o=mux(fr.filter((_,i)=>i%st==0).map(c=>c.toDataURL('image/webp',q)),100*st);
              if(o.length<=490000)return o}
            return null}

          const MAX=30;let ed='s',dm='new',nt=false;
          const go=h=>location.hash=h;
          function route(){const h=location.hash.slice(1);$('s1').hidden=h!=='';$('s2').hidden=h!=='pack';$('s3').hidden=h!=='edit';scrollTo(0,0)}
          window.onhashchange=route;
          const P=()=>PK.find(x=>x.id==sel);
          const tu=p=>'/p/'+p.id+'/tray.png?v='+p.version;
          function slot(label,url,tap,del,cls){
            const d=document.createElement('div'),b=document.createElement('span');d.className='sl'+(cls?' '+cls:'');b.textContent=label;d.append(b);
            if(url){const m=new Image();m.src=url;d.append(m)}else{const x=document.createElement('i');x.textContent='+';d.append(x)}
            d.onclick=tap;
            if(del){const x=document.createElement('u');x.textContent='×';x.onclick=e=>{e.stopPropagation();del()};d.append(x)}
            return d}
          function renderList(){
            const l=$('pl');l.replaceChildren();$('e0').hidden=PK.length>0;
            PK.forEach(p=>{
              const c=document.createElement('div'),m=p.tray?new Image():document.createElement('div'),w=document.createElement('div'),n=document.createElement('b'),a=document.createElement('small');
              c.className='pc';m.className='th';if(p.tray)m.src=tu(p);
              n.textContent=p.name;a.textContent=p.author+' · '+p.stickers.length+'/30 · '+(p.animated?'Animasyonlu':'Sticker');w.append(n,a);c.append(m,w);
              c.onclick=()=>{sel=p.id;try{localStorage.sel=sel}catch(e){}showPack();go('pack')};l.append(c)})}
          function showPack(){
            const p=P();if(!p)return;
            $('pt').textContent=p.name;$('pa').textContent=p.author+' · '+(p.animated?'Animasyonlu':'Sticker');
            const g=$('g');g.replaceChildren();
            g.append(slot('Paket simgesi',p.tray&&tu(p),()=>openEd('t'),null,'tr'));
            const n=MAX;
            for(let i=0;i<n;i++){const s=p.stickers[i];
              g.append(slot((s&&s.anim?'▶ ':'')+(i+1),s&&'/p/'+p.id+'/'+s.file,()=>{if(!s)openEd('s')},s&&(()=>{A.remove(p.id,i);load()})))}
            $('wa').classList.toggle('off',![false,true].some(a=>p.stickers.filter(s=>!!s.anim==a).length>=3))}
          function load(){
            PK=JSON.parse(A.packs());if(!P())sel=null;
            try{localStorage.sel=sel||''}catch(e){}
            renderList();showPack();route()}
          function openEd(m){
            ed=m;$('add').textContent=m=='t'?'Simge yap':'Pakete ekle';$('opt').hidden=m=='t';
            if(vid)vid.pause();vid=src=null;reset();$('f').value='';go('edit');$('f').click()}
          $('add').onclick=async()=>{
            const p=P();if(!A||!p)return toast('Sadece APK içinde çalışır');
            if(!src)return toast('Önce görsel veya video seç');
            const an=ed=='s'&&!!p.animated;if(an&&!vid)return toast('Animasyonlu paket için video seç');
            $('add').disabled=true;toast('Hazırlanıyor…');await new Promise(r=>setTimeout(r,60));
            try{
              const c=snap();
              if(ed=='t'){A.setTray(p.id,tray(c));load();history.back();return}
              let b;
              if(an){const o=await anim();if(!o)return toast('Video 500 KB altına inmedi: daha kısa veya sade bir video dene');b=b64(o)}
              else b=enc(c);
              const r=A.addSticker(p.id,b,$('em').value,tray(c),an);
              if(r!='ok')return toast(r);
              load();history.back();toast('Eklendi')
            }finally{$('add').disabled=false}};
          function dlg(m){
            dm=m;const p=P();$('dgt').textContent=m=='new'?(nt?'Yeni animasyonlu paket':'Yeni sticker paketi'):'Paketi düzenle';
            $('dn').value=m=='new'?'':p.name;$('da').value=m=='new'?(localStorage.au||''):p.author;$('ddel').hidden=$('dexp').hidden=m=='new';$('dg').hidden=false}
          $('nf').onclick=()=>A?$('tp').hidden=false:toast('Sadece APK içinde çalışır');
          $('mn').onclick=()=>dlg('edit');
          $('dx').onclick=()=>$('dg').hidden=true;
          $('dok').onclick=()=>{
            const n=$('dn').value,a=$('da').value;try{localStorage.au=a}catch(e){}
            $('dg').hidden=true;
