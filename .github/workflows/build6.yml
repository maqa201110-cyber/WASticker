          cat > app/src/main/java/com/example/wasticker/StickerContentProvider.kt <<'WA_EOF'
          package com.example.wasticker

          import android.content.ContentProvider
          import android.content.ContentValues
          import android.content.Context
          import android.content.UriMatcher
          import android.content.res.AssetFileDescriptor
          import android.database.Cursor
          import android.database.MatrixCursor
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          /** WhatsApp'a giden parça: uygulamadaki tek paket, WhatsApp kurallarına göre bölünür. */
          class Part(val id: String, val name: String, val anim: Boolean, val files: List<JSONObject>, val pack: JSONObject)

          /** filesDir/packs/packs.json + packs/<id>/{sN.webp, tray.png} */
          object Store {
              const val MAX = 30
              fun authority(c: Context) = c.packageName + ".stickercontentprovider"
              fun root(c: Context) = File(c.filesDir, "packs").apply { mkdirs() }
              fun dir(c: Context, id: String) = File(root(c), id).apply { mkdirs() }
              fun load(c: Context): JSONArray = try {
                  JSONArray(File(root(c), "packs.json").readText())
              } catch (e: Exception) { JSONArray() }
              fun save(c: Context, a: JSONArray) = File(root(c), "packs.json").writeText(a.toString())
              fun find(a: JSONArray, id: String): JSONObject? {
                  for (i in 0 until a.length()) if (a.getJSONObject(i).getString("id") == id) return a.getJSONObject(i)
                  return null
              }
              fun touch(p: JSONObject) { p.put("version", System.currentTimeMillis().toString()) }
              fun safe(c: Context, rel: String): File? {
                  val r = root(c).canonicalFile
                  val f = File(r, rel).canonicalFile
                  return if (f.path.startsWith(r.path + File.separator) && f.isFile) f else null
              }

              /** Sabit ve video ayrı gruplanır, her grup en fazla 30'luk eşit parçalara bölünür (en az 3 sticker şart). */
              fun parts(p: JSONObject): List<Part> {
                  val id = p.getString("id")
                  val st = p.getJSONArray("stickers")
                  val all = (0 until st.length()).map { st.getJSONObject(it) }
                  val groups = listOf(false, true)
                      .map { a -> a to all.filter { it.optBoolean("anim", p.optBoolean("animated")) == a } }
                      .filter { it.second.size >= 3 }
                  val out = ArrayList<Part>()
                  for ((a, list) in groups) {
                      val n = (list.size + 29) / 30
                      for (k in 0 until n) {
                          var name = p.getString("name")
                          if (groups.size > 1) name += if (a) " Video" else " Sabit"
                          if (n > 1) name += " ${k + 1}/$n"
                          out.add(Part("${id}_${if (a) "a" else "s"}${k + 1}", name.take(128), a,
                              list.subList(list.size * k / n, list.size * (k + 1) / n), p))
                      }
                  }
                  return out
              }

              fun allParts(c: Context): List<Part> {
                  val a = load(c)
                  return (0 until a.length()).flatMap { parts(a.getJSONObject(it)) }
                      .filter { File(dir(c, it.pack.getString("id")), "tray.png").exists() }
              }
          }

          class StickerContentProvider : ContentProvider() {
              private lateinit var matcher: UriMatcher
              private val meta = arrayOf(
                  "sticker_pack_identifier", "sticker_pack_name", "sticker_pack_publisher",
                  "sticker_pack_icon", "android_play_store_link", "ios_app_download_link",
                  "sticker_pack_publisher_email", "sticker_pack_publisher_website",
                  "sticker_pack_privacy_policy_website", "sticker_pack_license_agreement_website",
                  "image_data_version", "whatsapp_will_not_cache_stickers", "animated_sticker_pack"
              )

              override fun onCreate(): Boolean {
                  val a = Store.authority(context!!)
                  matcher = UriMatcher(UriMatcher.NO_MATCH).apply {
                      addURI(a, "metadata", 1)
                      addURI(a, "metadata/*", 2)
                      addURI(a, "stickers/*", 3)
                      addURI(a, "stickers_asset/*/*", 4)
                  }
                  return true
              }

              private fun row(p: Part) = arrayOf<Any>(
                  p.id, p.name, p.pack.getString("author"), "tray.png", "", "", "", "", "", "",
                  p.pack.getString("version"), 0, if (p.anim) 1 else 0
              )

              override fun query(uri: Uri, p: Array<String>?, s: String?, sa: Array<String>?, o: String?): Cursor? {
                  val ctx = context!!
                  val m = matcher.match(uri)
                  val parts = Store.allParts(ctx)
                  val last = uri.lastPathSegment
                  val cur = when (m) {
                      1, 2 -> MatrixCursor(meta).apply {
                          parts.filter { m == 1 || it.id == last }.forEach { addRow(row(it)) }
                      }
                      3 -> MatrixCursor(arrayOf("sticker_file_name", "sticker_emoji", "sticker_accessibility_text")).apply {
                          parts.find { it.id == last }?.files?.forEach {
                              addRow(arrayOf<Any>(it.getString("file"), it.getString("emoji"), ""))
                          }
                      }
                      else -> return null
                  }
                  cur.setNotificationUri(ctx.contentResolver, uri)
                  return cur
              }

              override fun openAssetFile(uri: Uri, mode: String): AssetFileDescriptor? {
                  if (matcher.match(uri) != 4) return null
                  val packId = uri.pathSegments[1].substringBeforeLast("_")
                  val f = Store.safe(context!!, packId + "/" + uri.pathSegments[2]) ?: return null
                  return AssetFileDescriptor(ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY), 0, f.length())
              }

              override fun getType(uri: Uri): String? {
                  val a = Store.authority(context!!)
                  return when (matcher.match(uri)) {
                      1, 2 -> "vnd.android.cursor.dir/vnd.$a.metadata"
                      3 -> "vnd.android.cursor.dir/vnd.$a.stickers"
                      4 -> if (uri.lastPathSegment!!.endsWith(".png")) "image/png" else "image/webp"
                      else -> null
                  }
              }

              override fun insert(uri: Uri, v: ContentValues?): Uri? = null
              override fun delete(uri: Uri, s: String?, a: Array<String>?) = 0
              override fun update(uri: Uri, v: ContentValues?, s: String?, a: Array<String>?) = 0
          }
