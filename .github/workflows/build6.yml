          package com.example.wasticker

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import android.webkit.*
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private val queue = ArrayDeque<Part>()

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                          val path = r.url.path ?: return null
                          return try {
                              when {
                                  path.startsWith("/p/") -> Store.safe(this@MainActivity, path.removePrefix("/p/"))?.let {
                                      WebResourceResponse(if (it.name.endsWith(".png")) "image/png" else "image/webp", null, it.inputStream())
                                  }
                                  path == "/index.html" -> WebResourceResponse("text/html", "utf-8", assets.open("index.html"))
                                  else -> null
                              }
                          } catch (e: Exception) { null }
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          startActivityForResult(
                              Intent(Intent.ACTION_GET_CONTENT).setType("*/*")
                                  .putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                                  .addCategory(Intent.CATEGORY_OPENABLE), 1
                          )
                          return true
                      }
                  }
                  web.loadUrl("https://app.local/index.html")
                  handleIntent(intent)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { if (web.canGoBack()) web.goBack() else super.onBackPressed() }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(r: Int, c: Int, d: Intent?) {
                  if (r == 1) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d))
                      fileCb = null
                  }
                  if (r == 3 && c == RESULT_OK) exportTo(d?.data)
                  if (r == 4 && c == RESULT_OK && d != null) importUris(d)
                  if (r == 2) {
                      val err = d?.getStringExtra("validation_error")
                      if (err != null) {
                          queue.clear()
                          Toast.makeText(this, err, Toast.LENGTH_LONG).show()
                      } else launchNext()
                  }
              }

              /** Paket birden fazla WhatsApp paketine bölündüyse sırayla ekletir. */
              private fun launchNext() {
                  val p = queue.removeFirstOrNull() ?: return
                  try {
                      startActivityForResult(
                          Intent("com.whatsapp.intent.action.ENABLE_STICKER_PACK")
                              .putExtra("sticker_pack_id", p.id)
                              .putExtra("sticker_pack_authority", Store.authority(this))
                              .putExtra("sticker_pack_name", p.name), 2
                      )
                  } catch (e: ActivityNotFoundException) {
                      queue.clear()
                      Toast.makeText(this, "WhatsApp bulunamadı.", Toast.LENGTH_LONG).show()
                  }
              }

              private var exportId: String? = null

              private var pendingMsg = ""

              private fun msg(s: String) {
                  pendingMsg = s
                  runOnUiThread { web.evaluateJavascript("window.onNative&&onNative()", null) }
              }

              private fun exportTo(uri: Uri?) {
                  val id = exportId ?: return
                  val p = Store.find(Store.load(this), id) ?: return
                  if (uri == null) return
                  Thread {
                      try {
                          contentResolver.openOutputStream(uri)?.use { os ->
                              ZipOutputStream(os).use { z ->
                                  fun put(n: String, b: ByteArray) { z.putNextEntry(ZipEntry(n)); z.write(b); z.closeEntry() }
                                  put("title.txt", p.getString("name").toByteArray())
                                  put("author.txt", p.getString("author").toByteArray())
                                  val dir = d(id)
                                  File(dir, "tray.png").takeIf { it.exists() }?.let { put("tray.png", it.readBytes()) }
                                  val st = p.getJSONArray("stickers")
                                  val meta = JSONArray()
                                  for (i in 0 until st.length()) {
                                      val s = st.getJSONObject(i)
                                      put("${i + 1}.webp", File(dir, s.getString("file")).readBytes())
                                      meta.put(JSONObject().put("file", "${i + 1}.webp").put("emoji", s.getString("emoji")).put("anim", s.optBoolean("anim")))
                                  }
                                  put("stickers.json", meta.toString().toByteArray())
                              }
                          }
                          msg("Dışa aktarıldı")
                      } catch (e: Exception) { msg("Dışa aktarma başarısız") }
                  }.start()
              }

              override fun onNewIntent(i: Intent) {
                  super.onNewIntent(i)
                  setIntent(i)
                  handleIntent(i)
              }

              /** Dosyalar uygulamasından "Birlikte aç" veya paylaş menüsünden gelen .wastickers / zip dosyaları. */
              @Suppress("DEPRECATION")
              private fun handleIntent(i: Intent?) {
                  if (i == null) return
                  val uris = ArrayList<Uri>()
                  when (i.action) {
                      Intent.ACTION_VIEW -> i.data?.let { uris.add(it) }
                      Intent.ACTION_SEND -> i.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)?.let { uris.add(it) }
                      Intent.ACTION_SEND_MULTIPLE -> i.getParcelableArrayListExtra<Uri>(Intent.EXTRA_STREAM)?.let { uris.addAll(it) }
                  }
                  if (uris.isEmpty()) return
                  i.action = null
                  importList(uris)
              }

              private fun isAnimWebp(b: ByteArray) = b.size > 21 && String(b, 12, 4) == "VP8X" && (b[20].toInt() and 2) != 0

              private fun importUris(data: Intent) {
                  val uris = ArrayList<Uri>()
                  data.clipData?.let { for (i in 0 until it.itemCount) uris.add(it.getItemAt(i).uri) }
                  if (uris.isEmpty()) data.data?.let { uris.add(it) }
                  importList(uris)
              }

              private fun importList(uris: List<Uri>) {
                  Thread {
                      var ok = 0
                      for (u in uris) {
                          try { if (importOne(u, ok)) ok++ } catch (e: Exception) { }
                      }
                      msg(if (ok > 0) "$ok paket içe aktarıldı" else "Dosya okunamadı veya sticker bulunamadı")
                  }.start()
              }

              /** .wastickers / .zip: title.txt, author.txt, png tray, webp stickers (+ varsa stickers.json). */
              private fun importOne(u: Uri, n: Int): Boolean {
                  val ent = LinkedHashMap<String, ByteArray>()
                  contentResolver.openInputStream(u)?.use { ins ->
                      ZipInputStream(ins).use { z ->
                          var e = z.nextEntry
                          while (e != null) {
                              if (!e.isDirectory) ent[e.name.substringAfterLast('/')] = z.readBytes()
                              e = z.nextEntry
                          }
                      }
                  }
                  val names = ent.keys.filter { it.endsWith(".webp", true) }
                      .sortedWith(compareBy({ it.substringBeforeLast('.').toIntOrNull() ?: Int.MAX_VALUE }, { it }))
                  if (names.isEmpty()) return false
                  val emo = HashMap<String, String>()
                  ent["stickers.json"]?.let { b ->
                      val a = JSONArray(String(b))
                      for (i in 0 until a.length()) emo[a.getJSONObject(i).getString("file")] = a.getJSONObject(i).getString("emoji")
                  }
                  val flags = names.map { isAnimWebp(ent[it]!!) }
                  val anim = flags.count { it } * 2 > flags.size
                  val id = "p${System.currentTimeMillis()}$n"
                  val dir = d(id)
                  val st = JSONArray()
                  for ((i, nm) in names.withIndex()) {
                      if (flags[i] != anim || st.length() >= Store.MAX) continue
                      val b = ent[nm]!!
                      if (b.size > (if (anim) 500_000 else 100_000)) continue
                      val f = "s${System.currentTimeMillis()}_$i.webp"
                      File(dir, f).writeBytes(b)
                      st.put(JSONObject().put("file", f).put("emoji", emo[nm] ?: "😀").put("anim", anim))
                  }
                  if (st.length() == 0) { dir.deleteRecursively(); return false }
                  val tb = ent["tray.png"] ?: ent.entries.firstOrNull { it.key.endsWith(".png", true) }?.value
                  val bmp = tb?.let { BitmapFactory.decodeByteArray(it, 0, it.size) }
                  if (bmp != null) File(dir, "tray.png").outputStream().use {
                      Bitmap.createScaledBitmap(bmp, 96, 96, true).compress(Bitmap.CompressFormat.PNG, 100, it)
                  }
                  val a = Store.load(this)
                  a.put(JSONObject().put("id", id)
                      .put("name", (ent["title.txt"]?.let { String(it).trim() } ?: "").ifEmpty { "İçe aktarılan paket" }.take(100))
                      .put("author", (ent["author.txt"]?.let { String(it).trim() } ?: "").ifEmpty { "Ben" }.take(100))
                      .put("animated", anim).put("version", "1").put("stickers", st))
                  Store.save(this, a)
                  return true
              }

              private fun d(id: String) = Store.dir(this, id)

              private fun mut(id: String, f: (JSONObject) -> String): String {
                  val a = Store.load(this)
                  val p = Store.find(a, id) ?: return "Paket bulunamadı"
                  val r = f(p)
                  if (r == "ok") { Store.touch(p); Store.save(this, a) }
                  return r
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun packs(): String {
                      val a = Store.load(this@MainActivity)
                      for (i in 0 until a.length()) {
                          val p = a.getJSONObject(i)
                          p.put("tray", File(d(p.getString("id")), "tray.png").exists())
                      }
                      return a.toString()
                  }

                  @JavascriptInterface
                  fun newPack(name: String, author: String, animated: Boolean): String {
                      val a = Store.load(this@MainActivity)
                      val id = "p" + System.currentTimeMillis()
                      a.put(JSONObject().put("id", id).put("name", name.trim().ifEmpty { "Paketim" }.take(100))
                          .put("author", author.trim().ifEmpty { "Ben" }.take(100))
                          .put("animated", animated).put("version", "1").put("stickers", JSONArray()))
                      Store.save(this@MainActivity, a)
                      return id
                  }

                  @JavascriptInterface
                  fun edit(id: String, name: String, author: String): String = mut(id) {
                      it.put("name", name.trim().ifEmpty { "Paketim" }.take(100))
                      it.put("author", author.trim().ifEmpty { "Ben" }.take(100))
                      "ok"
                  }

                  @JavascriptInterface
                  fun deletePack(id: String) {
                      val a = Store.load(this@MainActivity)
                      for (i in 0 until a.length()) if (a.getJSONObject(i).getString("id") == id) { a.remove(i); break }
                      Store.save(this@MainActivity, a)
                      d(id).deleteRecursively()
                  }

                  @JavascriptInterface
                  fun setTray(id: String, b64: String): String = mut(id) {
                      File(d(id), "tray.png").writeBytes(Base64.decode(b64, Base64.DEFAULT))
                      "ok"
                  }

                  @JavascriptInterface
                  fun addSticker(id: String, b64: String, emoji: String, tray: String, anim: Boolean): String = mut(id) { p ->
                      val st = p.getJSONArray("stickers")
                      if (st.length() >= Store.MAX) return@mut "Paket dolu (${Store.MAX})"
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      if (bytes.size > (if (anim) 500_000 else 100_000)) return@mut "Dosya çok büyük"
                      val name = "s${System.currentTimeMillis()}.webp"
                      File(d(id), name).writeBytes(bytes)
                      val t = File(d(id), "tray.png")
                      if (tray.isNotEmpty() && !t.exists()) t.writeBytes(Base64.decode(tray, Base64.DEFAULT))
                      st.put(JSONObject().put("file", name).put("emoji", emoji.trim().ifEmpty { "😀" }).put("anim", anim))
                      "ok"
                  }

                  @JavascriptInterface
                  fun remove(id: String, i: Int) {
                      mut(id) { p ->
                          val st = p.getJSONArray("stickers")
                          File(d(id), st.getJSONObject(i).getString("file")).delete()
                          st.remove(i)
                          "ok"
                      }
                  }

                  @JavascriptInterface
                  fun pending(): String { val m = pendingMsg; pendingMsg = ""; return m }

                  @JavascriptInterface
                  fun exportPack(id: String) {
                      val p = Store.find(Store.load(this@MainActivity), id) ?: return
                      exportId = id
                      val fn = p.getString("name").replace(Regex("[^\\p{L}\\p{N}_-]+"), "_").take(40)
                      runOnUiThread {
                          startActivityForResult(
                              Intent(Intent.ACTION_CREATE_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE)
                                  .setType("application/octet-stream").putExtra(Intent.EXTRA_TITLE, "$fn.wastickers"), 3
                          )
                      }
                  }

                  @JavascriptInterface
                  fun importPacks() {
                      runOnUiThread {
                          startActivityForResult(
                              Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE)
                                  .setType("*/*").putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true), 4
                          )
                      }
                  }

                  @JavascriptInterface
                  fun publish(id: String): String {
                      val p = Store.find(Store.load(this@MainActivity), id) ?: return "Paket bulunamadı"
                      val parts = Store.parts(p)
                      if (parts.isEmpty()) return "Sabit veya video türünden en az 3 sticker gerekli."
                      if (!File(d(id), "tray.png").exists()) return "Paket simgesi eksik."
                      val left = p.getJSONArray("stickers").length() - parts.sumOf { it.files.size }
                      queue.clear()
                      queue.addAll(parts)
                      runOnUiThread {
                          if (parts.size > 1) Toast.makeText(this@MainActivity, "${parts.size} paket sırayla eklenecek", Toast.LENGTH_LONG).show()
                          launchNext()
                      }
                      return if (left > 0) "ok:$left" else "ok"
                  }
              }
          }
